name: llps-rna
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.19
  - pip=26.0.1
  - libzlib=1.3.1
  - libgomp
  - pip:
      - -r requirements.txt
variables:
  PYTHONNOUSERSITE: '1'
  CUDA_VISIBLE_DEVICES: ''
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  TOKENIZERS_PARALLELISM: 'false'
